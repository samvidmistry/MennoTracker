name: menno_tracker
description: MennoTracker — StrongLifts-style tracker for a 5-day bro split.
publish_to: 'none'
version: 0.5.0+11

environment:
  sdk: ^3.5.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0
  fl_chart: ^0.69.0
  health: ^11.0.0
  collection: ^1.18.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  program:
    path: ../../packages/program
  shared_models:
    path: ../../packages/shared_models
  progression:
    path: ../../packages/progression

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
