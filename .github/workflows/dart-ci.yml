name: Dart & Flutter CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'
          cache: true
      - name: Resolve workspace
        run: dart pub get
      - name: Analyze
        run: dart analyze
      - name: Test program package
        run: dart test
        working-directory: packages/program
      - name: Test shared_models package
        run: dart test
        working-directory: packages/shared_models
      - name: Test progression package
        run: dart test
        working-directory: packages/progression
      - name: Flutter test phone app
        run: flutter test
        working-directory: apps/phone
