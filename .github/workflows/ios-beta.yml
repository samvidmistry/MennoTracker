# ============================================================
# DORMANT WORKFLOW — REQUIRES $99 APPLE DEVELOPER PROGRAM
# ============================================================
# This workflow will FAIL without these secrets configured:
#   MATCH_PASSWORD, MATCH_GIT_BASIC_AUTHORIZATION,
#   APP_STORE_CONNECT_API_KEY_BASE64,
#   APP_STORE_CONNECT_API_KEY_ID,
#   APP_STORE_CONNECT_API_ISSUER_ID
# See docs/migrate-to-paid-program.md for the activation steps.
# ============================================================
name: iOS Beta (TestFlight)
on:
  workflow_dispatch:
jobs:
  beta:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install fastlane bundle
        run: bundle install --gemfile=ci/fastlane/Gemfile
      - uses: actions/cache@v5
        with:
          path: apps/phone/ios/Pods
          key: pods-${{ hashFiles('apps/phone/ios/Podfile.lock') }}
      - name: Resolve Flutter dependencies
        run: flutter pub get
        working-directory: apps/phone
      - name: Install CocoaPods
        run: pod install --repo-update
        working-directory: apps/phone/ios
      - name: Upload TestFlight beta
        run: cd ci/fastlane && bundle exec fastlane ios beta
