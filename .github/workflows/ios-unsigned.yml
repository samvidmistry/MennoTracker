# Primary v1 release build. Produces an unsigned IPA for AltStore and can attach it to a GitHub release.
# Manual only to avoid spending macOS minutes on every commit. See docs/altstore-setup.md.
name: iOS Package and Release
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string
      release_name:
        description: "Release title"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get
        working-directory: apps/phone
      - run: cd apps/phone/ios && pod install --repo-update
      - run: flutter build ios --release --no-codesign
        working-directory: apps/phone
      - name: Package unsigned IPA
        run: |
          cd apps/phone/build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r MennoTracker.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: MennoTracker-unsigned-ipa
          path: apps/phone/build/ios/iphoneos/MennoTracker.ipa
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag_name }}"
          release_name="${{ inputs.release_name }}"
          if [ -z "$release_name" ]; then
            release_name="$tag"
          fi
          prerelease_flag=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" apps/phone/build/ios/iphoneos/MennoTracker.ipa --clobber
          else
            gh release create "$tag" apps/phone/build/ios/iphoneos/MennoTracker.ipa \
              --target "$GITHUB_SHA" \
              --title "$release_name" \
              $prerelease_flag
          fi
      - name: Update AltStore source manifest
        run: |
          python3 ci/update_altstore_source.py \
            --ipa apps/phone/build/ios/iphoneos/MennoTracker.ipa \
            --tag "${{ inputs.tag_name }}" \
            --apps-json apps.json \
            --repo "${{ github.repository }}"
      - name: Commit apps.json
        run: |
          if git diff --quiet -- apps.json; then
            echo "apps.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "chore(altstore): publish ${{ inputs.tag_name }} to apps.json"
          git push
