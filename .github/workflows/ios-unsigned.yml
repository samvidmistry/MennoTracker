# Primary v1 release build. Produces an unsigned IPA for AltStore and can attach it to a GitHub release.
# Manual only to avoid spending macOS minutes on every commit. See docs/altstore-setup.md.
name: iOS Package and Release
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string
      release_name:
        description: "Release title"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '15.4' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.44.x', cache: true }
      - uses: actions/cache@v5
        with:
          path: apps/phone/ios/Pods
          key: pods-${{ hashFiles('apps/phone/ios/Podfile.lock') }}
      - run: flutter pub get
        working-directory: apps/phone
      - run: cd apps/phone/ios && pod install --repo-update
      - run: flutter build ios --release --no-codesign
        working-directory: apps/phone
      - name: Package unsigned IPA
        run: |
          cd apps/phone/build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r MennoTracker.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: MennoTracker-unsigned-ipa
          path: apps/phone/build/ios/iphoneos/MennoTracker.ipa
          retention-days: 30
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_name || inputs.tag_name }}
          prerelease: ${{ inputs.prerelease }}
          files: apps/phone/build/ios/iphoneos/MennoTracker.ipa
